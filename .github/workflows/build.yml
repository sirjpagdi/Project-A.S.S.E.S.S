name: Build APK

# Builds Project A.S.S.E.S.S. on GitHub's servers, so no Android Studio or
# local Android SDK is needed. Every push and pull request produces a debug
# APK; a signed release APK is produced only when the four signing secrets
# below exist in the repo's Settings > Secrets and variables > Actions.
#
#   RELEASE_KEYSTORE_BASE64   the release .jks file, base64-encoded
#   RELEASE_STORE_PASSWORD    keystore password
#   RELEASE_KEY_ALIAS         key alias
#   RELEASE_KEY_PASSWORD      key password
#
# The release key and its passwords stay out of the repo (keystore.properties
# and *.jks are gitignored).

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: project-assess-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build signed release APK (only if signing secrets exist)
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "No release signing secrets set; skipping signed release build."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > release-key.jks
          {
            echo "storeFile=release-key.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KS_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties
          ./gradlew assembleRelease --stacktrace
          VN=$(grep -m1 -E '^\s*versionName\s+"' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/project_assess_v${VN}.apk"
          rm -f release-key.jks keystore.properties

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: project-assess-release-apk
          path: dist/*.apk
          if-no-files-found: ignore
