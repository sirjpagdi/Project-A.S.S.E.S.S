plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// v1.0.0 security hardening: release builds must be signed with a real,
// private release key — never the debug.keystore below, which is
// committed to this (public) repo and therefore not actually secret.
// keystore.properties is gitignored and holds the real values; if it's
// missing, this stays a harmless empty Properties object rather than
// throwing here, so debug builds (which never touch signingConfigs.release)
// are completely unaffected — only actually attempting a release build
// without it will fail, loudly, at that point. See
// keystore.properties.template for setup.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.jpagdi.mcqquickcheck'
    compileSdk 34

    defaultConfig {
        applicationId "com.jpagdi.projectassess"
        // minSdk 24 (Android 7.0, 2016) already covers the wide majority
        // of active devices as of mid-2026 — kept as-is for v2.9's
        // "support most Android devices" pass rather than lowered
        // further, since going below 24 would mean auditing every
        // AndroidX/Material/CameraX/OpenCV dependency's own minimum, a
        // much bigger and riskier change than this release's scope.
        // What v2.9 actually changed for compatibility: every new
        // permission-gated code path (POST_NOTIFICATIONS for the new
        // download notification) is guarded by Build.VERSION.SDK_INT
        // checks so it degrades safely rather than crashing on older
        // OS versions, matching the pattern this codebase already used
        // for the Q/29 (scoped storage) and O/26 (text justification)
        // checks elsewhere.
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // OpenCV's AAR bundles native .so libraries for 4 CPU architectures
        // (arm64-v8a, armeabi-v7a, x86, x86_64) — the x86/x86_64 ones only
        // matter for the Android Studio emulator, never for a real phone.
        // Restricting to the two real-device ABIs cuts a large chunk off
        // the APK size with no effect on installing to an actual device.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // v1.0.0: intentionally left with no values set when
        // keystore.properties doesn't exist yet — see the comment above
        // hasReleaseKeystore for why that's safe at config time.
        release {
            if (hasReleaseKeystore) {
                storeFile rootProject.file(keystoreProperties.getProperty("storeFile"))
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // v1.0.0: was minifyEnabled false, signed with the same
            // public debug.keystore as debug builds. Two separate fixes:
            // shrinking/obfuscation now on (raises the bar against casual
            // decompiling — not bulletproof, but meaningfully harder than
            // "reads like source"), and signed with the real private
            // release key instead of a key anyone with repo access has
            // always had. NOTE: this changes the app's signature from
            // every prior release (v1.0.0 and earlier, all of which used
            // debug.keystore) — installing this over an existing install
            // will require an uninstall first, once, same issue Radical
            // ran into with a different app. Necessary trade-off, and the
            // last time this should ever need to happen, since going
            // forward every release reuses this same real key.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    lint {
        baseline = file("lint-baseline.xml")
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.activity:activity-ktx:1.9.0'

    // Real computer-vision template matching for corner-marker detection —
    // replaces the earlier hand-rolled pixel-darkness heuristic, which kept
    // proving too fragile (missed real markers under some lighting, and
    // false-matched dark backgrounds like grass/walls/tables that had none
    // of the marker's actual shape). Official Maven Central AAR since
    // OpenCV 4.9.0 — no native SDK download/unzip needed, just resolves
    // like any other Gradle dependency.
    implementation 'org.opencv:opencv:4.9.0'

    // CameraX: live in-app preview + capture, replacing the old hand-off to
    // the system Camera app via ACTION_IMAGE_CAPTURE.
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
}
